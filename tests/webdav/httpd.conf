# Apache WebDAV server for tests/TestWebDav.cpp (official httpd:2.4 image), see scripts/test-webdav.sh
ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule alias_module modules/mod_alias.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule headers_module modules/mod_headers.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so

User daemon
Group daemon
ErrorLog /proc/self/fd/2
LogFormat "%r %>s" short
CustomLog /proc/self/fd/1 short

DavLockDB "/usr/local/apache2/var/DavLock"
DocumentRoot "/srv/webdav"

<Directory "/srv/webdav">
    Dav On
    Options +Indexes
    AuthType Basic
    AuthName "KeePassXC WebDAV tests"
    AuthUserFile "/usr/local/apache2/conf/htpasswd"
    Require valid-user
    AddType application/octet-stream .kdbx
</Directory>

# Regular share with strong ETags
<Directory "/srv/webdav/dav">
</Directory>

# No ETag at all
<Directory "/srv/webdav/noetag">
    FileETag None
    Header always unset ETag
</Directory>

# Server-side rename refused
<Directory "/srv/webdav/nomove">
    <Limit MOVE>
        Require all denied
    </Limit>
</Directory>

# Compressed responses (Apache then adds "-gzip" to the ETags it sends)
<Directory "/srv/webdav/gzip">
    SetOutputFilter DEFLATE
</Directory>

Redirect permanent /redirect /dav
